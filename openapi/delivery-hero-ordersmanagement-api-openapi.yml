    delete:
      summary: Cancel Specific Order
      description: 'Use this endpoint to cancel an existing order.

        It takes a JSON object containing an order.


        *NOTE:*


        *An order is only cancellable when it has not been accepted by a courier*

        '
      tags:
      - OrdersManagement
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          default: Bearer {access-token}
      - name: order_id
        in: path
        required: true
        description: ID of the order to get
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
        required: true
      responses:
        '203':
          description: Deprecated Success
