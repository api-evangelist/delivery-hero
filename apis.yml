aid: delivery-hero
name: Delivery Hero
description: >-
  Delivery Hero SE is a Berlin-based multinational online food-delivery and quick-commerce
  company operating in 70+ markets through local brands including foodpanda, Talabat, Glovo,
  PedidosYa, Yemeksepeti, Hungerstation and Pandamart. Its public developer surface exposes
  logistics and partner-integration APIs. The flagship On Demand Rider (ODR) API lets merchants
  request on-demand courier delivery across brands such as Glovo and pandago — registering
  outlets, estimating delivery fees and times, creating and tracking orders, retrieving proof
  of pickup/delivery/return, and receiving order-status, courier-location and refund webhooks.
  Additional Q-Commerce and Restaurant (POS) integration APIs handle order transmission and
  grocery assortment/promotion sync for restaurant and quick-commerce partners.
